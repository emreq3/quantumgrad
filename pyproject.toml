[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qta6"
version = "0.1.0"
description = "QTA6: a simulation-backed strategy game about quantum error detection, mitigation and correction"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "qiskit>=2.6,<2.7",
  "qiskit-aer>=0.18,<0.19",
  "qiskit-paulice>=0.3,<0.4",
  "stim>=1.16,<2",
  "pymatching>=2.4,<3",
  "sinter>=1.16,<2",
  "numpy>=2.0",
  "scipy>=1.14",
  "networkx>=3.4",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pydantic>=2.8,<3",
  "fastapi>=0.110",
  "uvicorn>=0.30",
  "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Optional, not required by the game: IBM/IQM specific add-ons (see docs/dependency_audit.md)
optional = ["qiskit-addon-pna>=0.2", "qiskit-addon-slc>=0.2"]

[project.scripts]
qta6 = "qta6.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qta6 = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: slower statistical or simulation tests",
]
