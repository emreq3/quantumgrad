name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Environment diagnostics
        run: python -m qta6.cli doctor
      - name: Scientific unit, physics, gameplay and integration tests
        run: pytest -o addopts="" -q -p no:warnings
      - name: Smoke benchmark (all three pillars, distance 3)
        run: python -m qta6.cli benchmark --profile smoke
      - name: Export campaign data and validate against the JSON schema
        run: python -m qta6.cli export --profile smoke --out /tmp/campaign_smoke.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Tests (includes Python-to-TypeScript conformance vectors)
        run: npm test
      - name: Production build
        run: npm run build
